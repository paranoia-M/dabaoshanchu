name: Build IT Supervision Platform

on:
  push:
    branches: [ "main" ] # 只有 push 到 main 分支才触发
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # 已移除 cache 选项，避免找不到 requirements.txt 报错

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 显式安装项目所需的所有依赖
        pip install PyQt6 pyinstaller cryptography pandas

    - name: Build EXE with PyInstaller
      run: |
        # 针对模块化动态加载结构的打包指令
        # --noconsole: 运行时隐藏命令行窗口
        # --onefile: 打包为单个 .exe 文件
        # --collect-submodules: 确保 importlib 动态加载的模块被包含
        # --add-data: 映射资源文件夹路径 (Windows 使用分号 ;)
        pyinstaller --noconsole --onefile `
        --collect-submodules modules `
        --add-data "modules;modules" `
        --add-data "core;core" `
        --add-data "ui;ui" `
        --name "IT_Supervision_Platform" `
        main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IT-Supervision-Platform-EXE
        path: dist/IT_Supervision_Platform.exe
        retention-days: 5